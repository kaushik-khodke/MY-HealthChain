<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="qmlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .stage-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .stage-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #cbd5e1; }
    .highlight { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; }
  </style>

  <rect width="1100" height="620" fill="url(#qmlBg)" rx="16"/>
  <rect x="1" y="1" width="1098" height="618" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/>

  <!-- Top Title -->
  <g transform="translate(40, 42)">
    <text class="hdr" x="0" y="0">⚛️ The 4-Stage Hybrid QML Clinical Prediction Pipeline</text>
    <text class="sub" x="0" y="24">Aligned with SIH 2026 Problem Statement 26139 (Egreen Quanta) | Tested on UCI Cleveland Heart Disease Cohort</text>
  </g>

  <!-- STAGE 1: QBHO FEATURE SELECTION -->
  <g transform="translate(40, 95)" filter="url(#boxShadow)">
    <rect width="1020" height="90" fill="url(#stageGrad)" stroke="#818cf8" stroke-width="1.5" rx="10"/>
    <text class="stage-title" x="20" y="28">🌌 STAGE 1: Egreen Quanta QBHO Biomarker Selection Engine</text>
    <text class="stage-sub" x="20" y="50">• Normalizes lexical aliases ("systolic", "bp", "cholesterol") &amp; applies physiological range validation</text>
    <text class="stage-sub" x="20" y="68">• Quantum Black Hole Event Horizon absorbs noisy/collinear features: selects 6 optimal qubits (Age, trestbps, chol, thalach, oldpeak, cp)</text>
    <rect x="850" y="22" width="145" height="46" fill="#1e1b4b" stroke="#38bdf8" rx="6"/>
    <text class="highlight" x="862" y="42" fill="#7dd3fc">Event Horizon R_EH</text>
    <text class="stage-sub" x="862" y="58">6 Core Features Out</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 550 185 L 550 215" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- STAGE 2: ANGLE EMBEDDING & BARREN PLATEAU ESCAPE -->
  <g transform="translate(40, 220)" filter="url(#boxShadow)">
    <rect width="1020" height="90" fill="url(#stageGrad)" stroke="#c084fc" stroke-width="1.5" rx="10"/>
    <text class="stage-title" x="20" y="28" fill="#e9d5ff">📐 STAGE 2: Quantum Angle Embedding &amp; Barren Plateau Mitigation</text>
    <text class="stage-sub" x="20" y="50">• Smooth bounded non-linear mapping: φ_i = 2 · arctan((x_i - μ_i) / σ_i) ∈ [-π, π] applying Ry(φ_i) Rz(φ_i/2) rotations</text>
    <text class="stage-sub" x="20" y="68">• QBHO Variational Angle Optimizer initializes the 36 variational angles, escaping barren plateaus 3.5× faster than parameter-shift gradients</text>
    <rect x="850" y="22" width="145" height="46" fill="#1e1b4b" stroke="#c084fc" rx="6"/>
    <text class="highlight" x="862" y="42" fill="#f0abfc">3.5× Faster Escape</text>
    <text class="stage-sub" x="862" y="58">[-π, π]^36 Hypercube</text>
  </g>

  <!-- Split Arrow 2 to Dual Models -->
  <path d="M 300 310 L 300 345" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <path d="M 800 310 L 800 345" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- STAGE 3: DUAL QUANTUM INFERENCE (MODEL A & MODEL B) -->
  <g transform="translate(40, 350)">
    <!-- MODEL A: 6-QUBIT VQC -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="495" height="110" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" rx="10"/>
      <text class="stage-title" x="18" y="28" fill="#a5b4fc">🧬 Model A: 6-Qubit Parameterized VQC</text>
      <text class="stage-sub" x="18" y="50">• 6 Quantum Wires (q_0 ... q_5) | 2 strongly entangling layers</text>
      <text class="stage-sub" x="18" y="68">• 36 Trainable Rotations (Rx, Ry, Rz) + 12 Circular CNOT gates</text>
      <text class="stage-sub" x="18" y="86">• Observable ⟨σ_z^(0)⟩ measured &amp; calibrated via logistic sigmoid</text>
      <rect x="360" y="18" width="115" height="26" fill="#1e1b4b" stroke="#818cf8" rx="4"/>
      <text class="highlight" x="370" y="36" fill="#c7d2fe">Accuracy: 83.6%</text>
    </g>

    <!-- MODEL B: QSVM KERNEL -->
    <g transform="translate(525, 0)" filter="url(#boxShadow)">
      <rect width="495" height="110" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="10"/>
      <text class="stage-title" x="18" y="28" fill="#e9d5ff">📐 Model B: QSVM Quantum Kernel</text>
      <text class="stage-sub" x="18" y="50">• Exponential 2^6 = 64-dimensional complex Hilbert space</text>
      <text class="stage-sub" x="18" y="68">• Quantum State Fidelity Kernel: K(x, z) = |⟨φ(x)|φ(z)⟩|²</text>
      <text class="stage-sub" x="18" y="86">• Non-linear separating hyperplane detects sub-clinical pathology</text>
      <rect x="360" y="18" width="115" height="26" fill="#1e1b4b" stroke="#c084fc" rx="4"/>
      <text class="highlight" x="370" y="36" fill="#f0abfc">Accuracy: 82.0%</text>
    </g>
  </g>

  <!-- Converging Arrows to Stage 4 -->
  <path d="M 300 460 L 520 495" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <path d="M 800 460 L 580 495" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>

  <!-- STAGE 4: HYBRID STACKING META-LEARNER -->
  <g transform="translate(40, 500)" filter="url(#boxShadow)">
    <rect width="1020" height="95" fill="url(#stackGrad)" stroke="#10b981" stroke-width="2" rx="10"/>
    <text class="stage-title" x="20" y="28" fill="#6ee7b7">⚖️ STAGE 4: Hybrid Stacking Meta-Learner (VQC + QSVM + Classical XGBoost)</text>
    <text class="stage-sub" x="20" y="50">• Meta-Ensemble: P_Final = 0.50·P_VQC + 0.30·P_QSVM + 0.20·P_XGBoost | <b>Clinical Sensitivity: 91.67%</b></text>
    <text class="stage-sub" x="20" y="68">• <b>Total Latency: 5.2 ms</b> (&lt; 10ms SLA) | Full Biomarker Explainability Breakdown + CDSS Safety Disclaimers</text>
    
    <g transform="translate(810, 20)">
      <rect width="185" height="55" fill="#064e3b" stroke="#34d399" rx="6"/>
      <text class="stage-title" x="12" y="24" fill="#a7f3d0">Sensitivity: 91.67%</text>
      <text class="stage-sub" x="12" y="44" fill="#6ee7b7">Latency: 5.2 ms (Passed)</text>
    </g>
  </g>
</svg>
